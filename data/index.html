<meta charset="UTF-8"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" type="image/png" href="/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1">

</head>
<body><div id="fb-loader"><div class="fb-spinner"></div></div>

<script>renderNav('home');</script>

<div class="container py-3 fb-page">

<!-- WiFi -->
<div class="fb-sec">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
  <span data-i18n="wifi.title">Rete Wi-Fi</span>
</div>
<div class="card mb-3 shadow-sm">
  <div class="card-body">
    <div class="d-flex align-items-center gap-2 mb-2">
      <span class="fb-dot fb-dot-warn" id="wifi-dot"></span>
      <span class="fw-semibold" id="wifi-label" data-i18n="sys.loading">carico...</span>
      <span class="ms-auto text-muted small" id="wifi-ip"></span>
    </div>
    <table class="table table-sm table-hover mb-2">
      <thead class="table-light"><tr><th>#</th><th data-i18n="wifi.col_ssid">SSID</th><th data-i18n="wifi.col_prio">Priorità</th><th></th></tr></thead>
      <tbody id="wifi-rows"><tr><td colspan="4" class="text-muted" data-i18n="sys.loading">carico...</td></tr></tbody>

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-primary flex-fill" onclick="wifiConnect()" data-i18n="wifi.btn_connect"><i class="bi bi-wifi"></i> Connetti ora</button>
      <button type="button" class="btn btn-outline-secondary flex-fill" onclick="wifiScan()" data-i18n="wifi.btn_scan"><i class="bi bi-search"></i> Scansiona</button>
    </div>
    <div id="wifi-scan-results"></div>
    <hr class="my-3">
    <form action="/wifi/add" method="POST">
      <div class="mb-2">
        <label class="form-label" data-i18n="wifi.label_ssid">SSID</label>

      <div class="mb-2">
        <label class="form-label" data-i18n="wifi.label_pass">Password</label>

        <label class="form-label" data-i18n="wifi.label_prio">Priorità (0 = massima)</label>

      </div>
    </form>
  </div>
</div>

<!-- LLM -->
<div class="fb-sec">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
  <span data-i18n="llm.title">Configurazione LLM</span>
</div>
<div class="card mb-3 shadow-sm">
  <div class="card-body">
    <form action="/llm/save" method="POST">
      <div class="row g-2 mb-2">
        <div class="col-4">
          <label class="form-label" data-i18n="llm.label_prov">Fornitore</label>
          <select class="form-select form-select-sm" name="provider" id="prov" onchange="onProvChange()">

            <option value="claude">claude</option>
          </select>
        </div>
        <div class="col-8">
          <label class="form-label" id="tok-lbl"><span data-i18n="llm.label_model">Modello</span> <small class="text-muted fw-normal" id="mdl-st"></small></label>
          <select class="form-select form-select-sm" name="model" id="mdl"></select>
        </div>
      </div>
      <div class="mb-2">
        <label class="form-label" data-i18n="llm.label_key">Token API</label>
        <input type="text" class="form-control form-control-sm" name="api_key" id="tok" placeholder="...">
      </div>
      <div class="d-grid d-sm-flex gap-2 justify-content-sm-end mt-2">
        <button type="submit" class="btn btn-primary" data-i18n="llm.btn_save"><i class="bi bi-floppy"></i> Salva configurazione AI</button>

      </div>

    </form>
  </div>
</div>

<!-- ElevenLabs -->
<div class="fb-sec">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
  <span data-i18n="el.title">ElevenLabs TTS</span>
</div>
<div class="card mb-3 shadow-sm">
  <div class="card-body">
    <form action="/el/save" method="POST">
      <div class="mb-2">
        <label class="form-label" data-i18n="el.label_key">Token API ElevenLabs</label>
        <input type="text" class="form-control form-control-sm" name="el_key" id="el-key" placeholder="API key...">

      <div class="mb-2">
        <label class="form-label" data-i18n="el.label_voice">Voce</label>

  </div>
</div>

<div class="fb-sec">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v6h10V2M7 7h3M7 11h10M7 15h10M7 19h10"/></svg>

</div>

    <div id="sd-status-row" class="d-flex align-items-center gap-2 mb-2">
      <span class="fb-dot fb-dot-warn"></span>
      <span class="fw-semibold" data-i18n="sys.loading">carico...</span>

    <div id="sd-btn"></div>
  </div>
</div>

<!-- VAD -->
<div class="fb-sec">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
  <span data-i18n="vad.title">Microfoni / Rilevamento voce</span>
</div>
<div class="card mb-3 shadow-sm">
  <div class="card-body">
    <div class="d-flex align-items-center gap-2 mb-3">
      <span class="fb-dot fb-dot-warn" id="vad-dot"></span>
      <span class="fw-semibold" id="vad-label" data-i18n="sys.loading">carico...</span>
    </div>
    <div class="d-flex gap-2 align-items-end mb-2">
      <div class="flex-fill">
        <label class="form-label" data-i18n="vad.label_thresh">Soglia sensibilità (RMS 0–32767, default 800)</label>

<!-- BLE -->
<div class="fb-sec">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/></svg>
  <span data-i18n="ble.title">Bluetooth Furby</span>
</div>
<div class="card mb-4 shadow-sm">
  <div class="card-body">
    <div class="d-flex align-items-center gap-2 mb-1">
      <span class="fb-dot fb-dot-err" id="ble-dot"></span>
      <span class="fw-semibold" id="ble-label" data-i18n="sys.loading">carico...</span>
      <span class="ms-auto text-muted small" id="ble-device"></span>
    </div>
    <div id="ble-uptime-row" class="text-muted small mb-2" style="display:none">
      <span data-i18n="ble.connected_for">connesso da: </span><span id="ble-uptime"></span>
    </div>
    <div class="d-flex gap-2 flex-wrap mb-2">
      <button type="button" class="btn btn-success" id="btn-scan" onclick="bleScan()" data-i18n="ble.scan"><i class="bi bi-bluetooth"></i> Cerca Furby</button>

      <button type="button" class="btn btn-warning" id="btn-disc" onclick="bleDisc()" style="display:none" data-i18n="ble.disconnect"><i class="bi bi-x-circle"></i> Disconnetti</button>

    <hr>
    <form action="/ble/save" method="POST">
      <div class="mb-2">
        <label class="form-label" data-i18n="ble.label_svc">Service UUID</label>
        <input type="text" class="form-control form-control-sm font-monospace" name="svc_uuid" id="ble-svc-uuid">
      </div>
      <div class="mb-2">
        <label class="form-label" data-i18n="ble.label_char">Characteristic UUID TX</label>
        <input type="text" class="form-control form-control-sm font-monospace" name="char_uuid" id="ble-char-uuid">
      </div>
      <div class="d-grid d-sm-flex justify-content-sm-end mt-2">

</div><!-- /container -->

<script src="/bootstrap.bundle.min.js"></script>
<script>
function applyHome(d){
  // WiFi
  var wdot=document.getElementById('wifi-dot');
  wdot.className='fb-dot '+(d.wifi_connected?'fb-dot-ok':'fb-dot-err');
  document.getElementById('wifi-label').textContent=d.wifi_connected?T('wifi.connected')+d.wifi_ssid:T('wifi.disconnected');
  document.getElementById('wifi-ip').textContent=d.ip||'';
  var rows='';
  if(d.wifi_nets&&d.wifi_nets.length){
    d.wifi_nets.forEach(function(n,i){
      var cur=d.wifi_connected&&n.ssid===d.wifi_ssid;
      var upBtn=i>0?'<form action="/wifi/up" method="POST" class="d-inline"><input type="hidden" name="idx" value="'+i+'"><button class="btn btn-outline-secondary btn-sm p-0 px-1"><i class="bi bi-arrow-up"></i></button></form>':'<button class="btn btn-outline-secondary btn-sm p-0 px-1" disabled><i class="bi bi-arrow-up"></i></button>';
      var dnBtn=i<d.wifi_nets.length-1?'<form action="/wifi/down" method="POST" class="d-inline"><input type="hidden" name="idx" value="'+i+'"><button class="btn btn-outline-secondary btn-sm p-0 px-1"><i class="bi bi-arrow-down"></i></button></form>':'<button class="btn btn-outline-secondary btn-sm p-0 px-1" disabled><i class="bi bi-arrow-down"></i></button>';
      var delBtn='<form action="/wifi/del" method="POST" class="d-inline"><input type="hidden" name="idx" value="'+i+'"><button class="btn btn-danger btn-sm p-0 px-1"><i class="bi bi-trash3"></i></button></form>';
      rows+='<tr>'
        +'<td class="text-muted small align-middle">'+(i+1)+'</td>'
        +'<td class="align-middle">'+n.ssid+(cur?' <span class="badge bg-success">'+T('wifi.active')+'</span>':'')+'</td>'
        +'<td class="text-muted small align-middle text-center">'+(n.prio!==undefined?n.prio:i)+'</td>'
        +'<td class="align-middle text-end"><div class="d-flex gap-1 justify-content-end">'+upBtn+dnBtn+delBtn+'</div></td>'
        +'</tr>';
    });
  } else {
    rows='<tr><td colspan="4" class="text-muted">'+T('wifi.no_nets')+'</td></tr>';
  }
  document.getElementById('wifi-rows').innerHTML=rows;

  // LLM
  document.getElementById('prov').value=d.llm_provider||'openai';
  document.getElementById('tok').value=d.cur_key||'';
  loadModels(d.llm_model);

  // ElevenLabs
  document.getElementById('el-key').value=d.el_key||'';
  var fmt=d.el_fmt||'mp3';
  document.getElementById('fmt-pcm').checked=(fmt==='pcm');
  document.getElementById('fmt-mp3').checked=(fmt==='mp3');
  document.getElementById('fmt-hint').textContent=fmt==='mp3'?T('el.hint_mp3'):T('el.hint_pcm');
  loadVoices(d.el_vid||'');

  // SD
  var sdRow=document.getElementById('sd-status-row');
  var sdBtn=document.getElementById('sd-btn');
  if(d.sd_present){
    sdRow.innerHTML='<span class="fb-dot fb-dot-ok"></span><span class="fw-semibold">'+T('sd.present')+'</span><span class="ms-auto text-muted small">'+d.sd_used_mb+' / '+d.sd_total_mb+' MB</span>';
    sdBtn.innerHTML='<form action="/sd/format" method="POST"><button type="submit" class="btn btn-danger btn-sm" onclick="return confirm(\''+T('sd.format_confirm')+'\')">'+T('sd.btn_format')+'</button></form>';
  } else {
    sdRow.innerHTML='<span class="fb-dot fb-dot-warn"></span><span class="fw-semibold">'+T('sd.absent')+'</span><span class="ms-auto text-muted small">'+T('sd.absent_sub')+'</span>';
    sdBtn.innerHTML='';
  }

  // VAD / STT
  _vadThresh=d.vad_threshold||800;
  document.getElementById('vad-thresh').value=_vadThresh;
  vadApplyUI(!!d.vad_enabled, !!d.stt_enabled);

  // BLE UUID
  document.getElementById('ble-svc-uuid').value=d.ble_svc_uuid||'';
  document.getElementById('ble-char-uuid').value=d.ble_char_uuid||'';
}
fetch('/api/home').then(function(r){return r.json();}).then(applyHome).catch(function(){});

var _vadEnabled=false,_vadThresh=800,_sttEnabled=false;
function vadSaveThresh(){
  var thr=document.getElementById('vad-thresh').value;
  if(!thr)return;
  var fd=new FormData();fd.append('threshold',thr);fd.append('enabled',_vadEnabled?'1':'0');
  fetch('/vad/save',{method:'POST',body:fd}).catch(function(){});
}
function vadApplyUI(vad_en, stt_en){
  _vadEnabled=vad_en; _sttEnabled=stt_en;
  document.getElementById('vad-dot').className='fb-dot '+(vad_en?'fb-dot-ok':'fb-dot-warn');
  document.getElementById('vad-label').textContent=vad_en?T('vad.active'):T('vad.disabled');
  var bv=document.getElementById('btn-vad-tog');
  bv.className=vad_en?'btn btn-success btn-sm':'btn btn-outline-secondary btn-sm';
  bv.innerHTML=vad_en?'<i class="bi bi-mic-fill"></i>':'<i class="bi bi-mic-mute"></i>';
  document.getElementById('stt-dot').className='fb-dot '+(stt_en?'fb-dot-ok':'fb-dot-warn');
  document.getElementById('stt-label').textContent=stt_en?T('stt.active'):T('stt.disabled');
  var bs=document.getElementById('btn-stt-tog');
  bs.className=stt_en?'btn btn-success btn-sm':'btn btn-outline-secondary btn-sm';
}
function vadSaveAndApply(fd){
  fetch('/vad/save',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(d){
    if(d.ok) vadApplyUI(d.vad_enabled, d.stt_enabled);
  }).catch(function(){});
}
function vadToggle(){
  var fd=new FormData();fd.append('threshold',document.getElementById('vad-thresh').value||_vadThresh);fd.append('enabled',_vadEnabled?'0':'1');
  vadSaveAndApply(fd);
}
function sttToggle(){
  var fd=new FormData();fd.append('stt_enabled',_sttEnabled?'0':'1');
  vadSaveAndApply(fd);
}
function fmtChange(){
  var fmt=document.querySelector('input[name=el_fmt]:checked').value;
  document.getElementById('fmt-hint').textContent=fmt==='mp3'?T('el.hint_mp3'):T('el.hint_pcm');
}

// BLE
function bleApply(d){
  var dot=document.getElementById('ble-dot'),lbl=document.getElementById('ble-label'),dev=document.getElementById('ble-device');
  var scan=document.getElementById('btn-scan'),stop=document.getElementById('btn-stop'),disc=document.getElementById('btn-disc');
  var msg=document.getElementById('ble-scanning'),lst=document.getElementById('ble-list');
  var upRow=document.getElementById('ble-uptime-row');
  if(d.uptime!==undefined){_bootRefSet(Date.now(),d.uptime);_uptimeTick();}
  if(d.connected){document.getElementById('ble-uptime').textContent=fmtSec(d.ble_uptime);upRow.style.display='';}
  else{upRow.style.display='none';}
  if(d.connected){
    dot.className='fb-dot fb-dot-ok';lbl.textContent=T('ble.connected');dev.textContent=d.name||'';
    scan.style.display='none';stop.style.display='none';disc.style.display='';msg.style.display='none';lst.innerHTML='';
  } else if(d.connecting){
    dot.className='fb-dot fb-dot-warn';lbl.textContent=T('ble.connecting');dev.textContent='';
    scan.style.display='none';stop.style.display='none';disc.style.display='none';msg.style.display='none';
    setTimeout(blePoll,1000);
  } else if(d.scanning){
    dot.className='fb-dot fb-dot-warn';lbl.textContent=T('ble.scanning');dev.textContent='';
    scan.style.display='none';stop.style.display='';disc.style.display='none';msg.style.display='block';
    if(d.devices&&d.devices.length){
      var h='<div class="small text-muted fw-bold text-uppercase mb-1">'+T('ble.found_so_far')+'</div>';
      d.devices.forEach(function(dv){h+='<div class="d-flex align-items-center gap-2 py-1 border-bottom"><span class="flex-fill small">'+dv.name+' <span class="text-muted">'+dv.addr+'</span></span><button class="btn btn-success btn-sm" onclick="bleConn(\''+dv.addr+'\')">'+T('ble.connect')+'</button></div>';});
      lst.innerHTML=h;
    }
    setTimeout(blePoll,1500);
  } else {
    dot.className='fb-dot fb-dot-err';lbl.textContent=T('ble.not_connected');dev.textContent='';
    scan.style.display='';stop.style.display='none';disc.style.display='none';msg.style.display='none';
    if(d.devices&&d.devices.length){
      var h='<div class="small text-muted fw-bold text-uppercase mb-1">'+T('ble.furby_found')+'</div>';
      d.devices.forEach(function(dv){h+='<div class="d-flex align-items-center gap-2 py-1 border-bottom"><span class="flex-fill small">'+dv.name+' <span class="text-muted">'+dv.addr+'</span></span><button class="btn btn-success btn-sm" onclick="bleConn(\''+dv.addr+'\')">'+T('ble.connect')+'</button></div>';});
      lst.innerHTML=h;
    } else {lst.innerHTML='';}
  }
}
function blePoll(){fetch('/ble/status').then(function(r){return r.json();}).then(bleApply).catch(function(){});}
function bleScan(){document.getElementById('ble-list').innerHTML='';bleApply({connected:false,scanning:true,name:'',devices:[]});fetch('/ble/scan',{method:'POST'}).catch(function(){});}
function bleConn(addr){var fd=new FormData();fd.append('addr',addr);fetch('/ble/connect',{method:'POST',body:fd}).then(function(){bleApply({connected:false,connecting:true,scanning:false,name:'',devices:[]});bleConnPoll();}).catch(function(){});}
function bleConnPoll(){fetch('/ble/status').then(function(r){return r.json();}).then(function(d){bleApply(d);if(d.connecting)setTimeout(bleConnPoll,800);}).catch(function(){setTimeout(bleConnPoll,1000);});}
function bleStop(){fetch('/ble/scan/stop',{method:'POST'}).then(blePoll).catch(function(){});}
function bleDisc(){fetch('/ble/disconnect',{method:'POST'}).then(blePoll).catch(function(){});}
blePoll();
setInterval(blePoll,5000);

// LLM
var FALLBACK={openai:['gpt-4o','gpt-4o-mini','gpt-4-turbo','o1','o3-mini'],claude:['claude-opus-4-7','claude-sonnet-4-6','claude-haiku-4-5-20251001']};
var PH={openai:'sk-...  (OpenAI)',claude:'sk-ant-...  (Anthropic)'};
function fillSelect(list,cur){
  var sel=document.getElementById('mdl');sel.innerHTML='';var found=false;
  list.forEach(function(m){var o=document.createElement('option');o.value=m;o.text=m;if(m===cur){o.selected=true;found=true;}sel.appendChild(o);});
  if(!found){var o=document.createElement('option');o.value=cur;o.text=cur+' (current)';o.selected=true;sel.insertBefore(o,sel.firstChild);}
}
function loadModels(cur){
  var p=document.getElementById('prov').value,st=document.getElementById('mdl-st');
  st.textContent=T('llm.models_loading');
  fetch('/api/models?provider='+p).then(function(r){return r.json();}).then(function(d){
    var list=Array.isArray(d)?d:(d.models||[]);
    if(!d.ok&&d.error==='no_key'){fillSelect(FALLBACK[p]||[cur],cur);st.textContent=T('llm.models_no_key');}
    else if(!list.length){fillSelect(FALLBACK[p]||[cur],cur);st.textContent=T('llm.models_none');}
    else{list.sort();fillSelect(list,cur||list[0]);st.textContent=list.length+T('llm.models_count');}
  }).catch(function(){fillSelect(FALLBACK[p]||[cur||''],cur||'');st.textContent=T('llm.models_offline');});
}
function onProvChange(){
  var p=document.getElementById('prov').value;
  document.getElementById('tok').placeholder=PH[p]||'Token API';
  document.getElementById('tok').value='';
  loadModels('');
}
function testLlm(){var el=document.getElementById('llm-test-result');el.className='small mt-1 text-warning';el.textContent=T('llm.test_running');fetch('/api/test?type=llm').then(function(r){return r.json();}).then(function(d){el.className='small mt-1 '+(d.ok?'text-success':'text-danger');el.textContent=d.ok?T('llm.test_ok')+d.info:T('llm.test_err')+d.error;if(d.ok)loadModels('');}).catch(function(){el.className='small mt-1 text-danger';el.textContent=T('llm.test_timeout');});}
function testEl(){var el=document.getElementById('el-test-result');el.className='small mt-1 text-warning';el.textContent=T('llm.test_running');fetch('/api/test?type=el').then(function(r){return r.json();}).then(function(d){el.className='small mt-1 '+(d.ok?'text-success':'text-danger');el.textContent=d.ok?T('llm.test_ok')+d.info:T('llm.test_err')+d.error;}).catch(function(){el.className='small mt-1 text-danger';el.textContent=T('llm.test_timeout');});}

// WiFi
function wifiConnect(){
  fetch('/wifi/connect',{method:'POST'}).then(function(r){return r.json();}).then(function(d){
    if(d.ok)location.href='/wifi/connecting';
    else alert(d.error||T('wifi.connect_err'));
  }).catch(function(){alert(T('wifi.connect_err'));});
}
function wifiScan(){
  var el=document.getElementById('wifi-scan-results');
  el.innerHTML='<p class="small text-warning mt-2">'+T('wifi.scan_wait')+'</p>';
  fetch('/api/wifi/scan').then(function(r){return r.json();}).then(function(d){
    if(!d.nets||!d.nets.length){el.innerHTML='<p class="small text-muted mt-2">'+T('wifi.scan_none')+'</p>';return;}
    var h='<table class="table table-sm table-hover mt-2"><thead class="table-light"><tr><th>SSID</th><th>dBm</th><th></th><th></th></tr></thead><tbody>';
    d.nets.forEach(function(n){
      var rc=n.rssi>-60?'text-success':n.rssi>-75?'text-warning':'text-danger';
      h+='<tr>'
        +'<td class="align-middle fw-semibold">'+n.ssid+'</td>'
        +'<td class="align-middle small '+rc+'">'+n.rssi+'</td>'
        +'<td class="align-middle">'+(n.open?'<span class="badge bg-warning text-dark">'+T('wifi.open')+'</span>':'<span class="badge bg-secondary">WPA</span>')+'</td>'
        +'<td class="align-middle text-end"><button type="button" class="btn btn-success btn-sm" onclick="document.getElementById(\'ssid-inp\').value=\''+n.ssid+'\'">'+T('wifi.scan_use')+'</button></td>'
        +'</tr>';
    });
    el.innerHTML=h+'</tbody></table>';
  }).catch(function(){el.innerHTML='<p class="small text-danger mt-2">'+T('wifi.scan_err')+'</p>';});
}

// ElevenLabs voices
function loadVoices(curVid){
  fetch('/api/voices').then(function(r){return r.json();}).then(function(voices){
    var sel=document.getElementById('el-voice-sel');
    if(!voices||!voices.length){sel.innerHTML='<option value="'+curVid+'">'+curVid+'</option>';return;}
    sel.innerHTML='';
    voices.forEach(function(v){var o=document.createElement('option');o.value=v.id;o.textContent=v.name+' ('+v.id+')';if(v.id===curVid)o.selected=true;sel.appendChild(o);});
    if(!sel.value&&curVid){var o=document.createElement('option');o.value=curVid;o.textContent=curVid;o.selected=true;sel.insertBefore(o,sel.firstChild);}
  }).catch(function(){document.getElementById('el-voice-sel').innerHTML='<option value="">—</option>';});
}

(function(){var sel=document.getElementById('lang-sel-shared');if(sel)sel.value=localStorage.getItem('furby_lang')||'it';})();
