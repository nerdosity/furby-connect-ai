<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" type="image/png" href="/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Furby Camera</title>
<link rel="stylesheet" href="/bootstrap.min.css">
<link rel="stylesheet" href="/bootstrap-icons.min.css">
<link rel="stylesheet" href="/shared.css">
</head>
<body><div id="fb-loader"><div class="fb-spinner"></div></div>

<script src="/shared.js"></script>
<script>renderNav('camera');</script>

<div id="sys-bar" data-i18n="sys.loading">carico...</div>

<div class="container py-3 fb-page">

  <!-- stream -->
  <div class="card shadow-sm mb-3">
    <div class="card-body p-2">
      <div class="ratio ratio-4x3 bg-black rounded overflow-hidden">
        <img id="camimg" src="/camera/stream" alt="camera" style="object-fit:contain">
      </div>
      <div class="d-flex align-items-center gap-2 mt-2 flex-wrap">
        <span class="text-muted small flex-fill" id="cam-status" data-i18n="cam.streaming">Streaming MJPEG attivo</span>
        <button class="btn btn-outline-secondary px-3" id="btn-tog" onclick="toggleStream()" data-i18n="cam.pause"><i class="bi bi-pause-fill"></i> Pausa</button>
        <button class="btn btn-outline-secondary px-3" onclick="setQuality(12)" data-i18n="cam.quality_high"><i class="bi bi-arrow-up-circle"></i> Qualità alta</button>
        <button class="btn btn-outline-secondary px-3" onclick="setQuality(25)" data-i18n="cam.quality_low"><i class="bi bi-arrow-down-circle"></i> Qualità bassa</button>
      </div>
    </div>
  </div>

  <!-- LLM describe -->
  <div class="card shadow-sm">
    <div class="card-body">
      <h6 class="text-uppercase text-muted fw-bold small mb-1" data-i18n="cam.describe_title"><i class="bi bi-cpu"></i> Descrivi frame con LLM</h6>
      <p class="text-muted small mb-2" data-i18n="cam.describe_hint">Cattura un frame e chiedi all'LLM configurato di descriverlo con il prompt qui sotto.</p>
      <textarea class="form-control form-control-sm font-monospace mb-2" id="desc-prompt" rows="4" placeholder="Sei un Furby maleducato..."></textarea>
      <div class="d-grid d-sm-flex gap-2 justify-content-sm-end mt-2">
        <button class="btn btn-primary px-3" onclick="descSavePrompt()" data-i18n="cam.save_prompt"><i class="bi bi-floppy"></i> Salva prompt</button>
        <button class="btn btn-success px-3" onclick="descRun()" id="btn-desc" data-i18n="cam.describe_now"><i class="bi bi-eye"></i> Descrivi ora</button>
      </div>

      <!-- TTS toggle -->
      <div class="border rounded overflow-hidden">
        <!-- toggle row -->
        <div class="d-flex align-items-center justify-content-between px-3 py-2" style="cursor:pointer" onclick="ttsToggle()">
          <span class="fw-semibold small" data-i18n="cam.tts_voice"><i class="bi bi-volume-up"></i> Output vocale</span>
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="chk-tts" style="pointer-events:none">
          </div>
        </div>
        <!-- dest row (collapsed by default) -->
        <div id="tts-dest-row" class="border-top px-3 py-2 bg-light" style="display:none">
          <div class="btn-group w-100 mb-2" role="group">
            <input type="radio" class="btn-check" name="tts-dest" id="tts-browser" value="browser" checked>
            <label class="btn btn-outline-primary" for="tts-browser" data-i18n="cam.tts_browser">Browser</label>
            <input type="radio" class="btn-check" name="tts-dest" id="tts-board" value="board">
            <label class="btn btn-outline-primary" for="tts-board" data-i18n="cam.tts_board">Board</label>
          </div>
          <p class="text-muted small mb-0" data-i18n="cam.tts_hint">Browser: Web Speech API — Board: ElevenLabs via ESP32</p>
        </div>
      </div>

      <div id="desc-status" class="text-muted small mt-2"></div>
      <div id="desc-out" class="mt-2 p-3 rounded border bg-light small" style="display:none;white-space:pre-wrap;line-height:1.5"></div>
    </div>
  </div>

</div>

<script src="/bootstrap.bundle.min.js"></script>
<script>
var running=true;
function toggleStream(){
  running=!running;
  var img=document.getElementById('camimg');
  var st=document.getElementById('cam-status');
  var btn=document.getElementById('btn-tog');
  btn.innerHTML=running?T('cam.pause'):T('cam.resume');
  if(running){img.src='/camera/stream';st.textContent=T('cam.streaming');}
  else{img.src='';st.textContent=T('cam.paused');}
}
function setQuality(q){fetch('/camera/quality?q='+q,{method:'POST'}).catch(function(){});}

fetch('/camera/describe/prompt').then(function(r){return r.json();}).then(function(d){
  document.getElementById('desc-prompt').value=d.prompt||'';
}).catch(function(){});

function descSavePrompt(){
  var fd=new FormData();
  fd.append('prompt',document.getElementById('desc-prompt').value);
  fetch('/camera/describe/prompt',{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(d){
      var st=document.getElementById('desc-status');
      st.textContent=d.ok?T('cam.saved'):T('cam.error');
      setTimeout(function(){st.textContent='';},2000);
    });
}

function ttsToggle(){
  var chk=document.getElementById('chk-tts');
  chk.checked=!chk.checked;
  document.getElementById('tts-dest-row').style.display=chk.checked?'block':'none';
}

function speakBrowser(text){
  if(!window.speechSynthesis){alert(T('cam.speech_unsupported'));return;}
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang=navigator.language||'it-IT';
  window.speechSynthesis.speak(u);
}
function speakBoard(text){
  var st=document.getElementById('desc-status');
  st.textContent=T('cam.tts_sending');
  var fd=new FormData();fd.append('text',text);
  fetch('/test/tts',{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(d){
      st.textContent=d.ok?T('cam.tts_playing'):T('cam.tts_err')+(d.error||'?');
      setTimeout(function(){st.textContent='';},3500);
    })
    .catch(function(){st.textContent=T('cam.error_conn');});
}
function descRun(){
  var btn=document.getElementById('btn-desc');
  var st=document.getElementById('desc-status');
  var out=document.getElementById('desc-out');
  btn.disabled=true;st.textContent=T('cam.sending');out.style.display='none';
  fetch('/camera/describe',{method:'POST'})
    .then(function(r){return r.json();})
    .then(function(d){
      btn.disabled=false;st.textContent='';
      if(d.ok){
        out.style.display='block';out.textContent=d.text;
        if(document.getElementById('chk-tts').checked){
          var dest=document.querySelector('input[name=tts-dest]:checked').value;
          if(dest==='browser')speakBrowser(d.text);else speakBoard(d.text);
        }
      } else {st.textContent=T('cam.error')+' '+(d.error||'?');}
    })
    .catch(function(){btn.disabled=false;st.textContent=T('cam.error_conn');});
}
window.addEventListener('beforeunload',function(){
  document.getElementById('camimg').src='';
  navigator.sendBeacon('/camera/off');
});
(function(){var sel=document.getElementById('lang-sel-shared');if(sel)sel.value=localStorage.getItem('furby_lang')||'it';})();
</script>
</body></html>
