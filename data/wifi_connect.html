<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" type="image/png" href="/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting…</title>
<link rel="stylesheet" href="/bootstrap.min.css">
<link rel="stylesheet" href="/bootstrap-icons.min.css">
<link rel="stylesheet" href="/shared.css">
</head>
<body><div id="fb-loader"><div class="fb-spinner"></div></div>
<script src="/mock.js"></script>
<script src="/shared.js"></script>
<script>renderNav(null);</script>
<div class="d-flex align-items-center justify-content-center" style="min-height:60vh">
<div class="card shadow text-center" style="max-width:340px;width:100%">
  <div class="card-body py-4 px-4">
    <div class="spinner-border text-primary mb-3" id="spin" role="status" style="width:2.5rem;height:2.5rem">
      <span class="visually-hidden">Loading…</span>
    </div>
    <p class="mb-1 text-secondary" id="msg" data-i18n="wc.connecting">Connessione in corso…</p>
    <p class="small text-muted mb-2" id="detail"></p>
    <a class="btn btn-outline-primary px-3 mt-2 d-none" id="back" href="/" data-i18n="wc.back"><i class="bi bi-house"></i> Torna alla home</a>
  </div>
</div>
</div>
<script src="/bootstrap.bundle.min.js"></script>
<script>
var spin=document.getElementById('spin');
var msg=document.getElementById('msg');
var detail=document.getElementById('detail');
var back=document.getElementById('back');
function spinColor(cls){spin.classList.replace('text-primary',cls)||spin.classList.add(cls);}
(function(){
  var t=setInterval(function(){
    fetch('/wifi/connect/status').then(function(r){return r.json();}).then(function(d){
      if(d.state===2){
        clearInterval(t);
        spinColor('text-success');
        msg.textContent=T('wc.connected');
        detail.textContent=(d.ssid||'')+' - '+(d.ip||'');
        setTimeout(function(){location.href='http://'+d.ip+'/';},800);
      } else if(d.state===3){
        clearInterval(t);
        spinColor('text-danger');
        msg.textContent=T('wc.failed');
        back.classList.remove('d-none');
      }
    }).catch(function(){});
  },1000);
})();
</script>
</body></html>
