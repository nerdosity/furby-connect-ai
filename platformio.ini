[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Librerie necessarie
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; SPIFFS — file system su partizione spiffs (data/ viene flashata con: pio run -t uploadfs)
board_build.filesystem = spiffs

; Flash e memoria
board_build.flash_size   = 16MB
board_build.flash_mode   = qio
board_build.partitions   = partitions_16mb.csv
board_upload.flash_size  = 16MB

; PSRAM OPI — Waveshare ESP32-S3-CAM ha PSRAM in modalità Octal (OPI)
; senza questo la PSRAM non viene montata nel heap e heap_caps_malloc(SPIRAM) restituisce sempre NULL
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=1

; sdkconfig.defaults: riduce buffer SSL da 16KB a 4KB/dir -> libera ~24KB di heap interno per mbedTLS
board_build.sdkconfig = sdkconfig.defaults

; Velocità upload (abbassa a 460800 se ci sono errori)
upload_speed = 921600

; Monitor seriale
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
